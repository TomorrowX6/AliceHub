def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}
apply plugin: 'kotlin-android'

def readGitCommit = { boolean shortHash ->
    try {
        def args = shortHash ? ['git', 'rev-parse', '--short', 'HEAD'] : ['git', 'rev-parse', 'HEAD']
        def proc = args.execute(null, rootProject.projectDir)
        proc.waitFor()
        def out = proc.in.text.trim()
        return out ==~ /[0-9a-f]{4,40}/ ? out : 'unknown'
    } catch (Exception ignored) {
        return 'unknown'
    }
}

android {
    if (buildAsApplication) {
        namespace "io.github.kichikuou.xsystem4"
    }
    compileSdkVersion 34
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId 'io.github.alicehub'
        minSdkVersion 26
        targetSdkVersion 34
        ndk { abiFilters 'arm64-v8a' }
        def ciRunNumber = (project.findProperty('APP_VERSION_CODE')
                ?: System.getenv('APP_VERSION_CODE')
                ?: System.getenv('GITHUB_RUN_NUMBER'))?.toString()?.trim()
        versionCode (ciRunNumber ? (100 + ciRunNumber.toInteger()) : 4)
        def configuredVersionName = (project.findProperty('APP_VERSION_NAME')
                ?: System.getenv('APP_VERSION_NAME'))?.toString()?.trim()
        versionName (configuredVersionName ? configuredVersionName : readGitCommit(true))
        buildConfigField 'String', 'GIT_COMMIT', '"' + readGitCommit(false) + '"'
    }
    def releaseKeystoreFile = rootProject.file('keystore.jks')
    def releaseStorePassword = (project.findProperty('KEYSTORE_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD'))?.toString()?.trim()
    def releaseKeyAlias = (project.findProperty('KEY_ALIAS') ?: System.getenv('KEY_ALIAS'))?.toString()?.trim()
    def releaseKeyPassword = (project.findProperty('KEY_PASSWORD') ?: System.getenv('KEY_PASSWORD'))?.toString()?.trim()
    def hasReleaseSigning = releaseKeystoreFile.isFile() &&
            releaseStorePassword &&
            releaseKeyAlias &&
            releaseKeyPassword
    def requireReleaseSigning = (project.findProperty('CI_REQUIRE_RELEASE_SIGNING')
            ?: System.getenv('CI_REQUIRE_RELEASE_SIGNING'))?.toString()?.trim()?.equalsIgnoreCase('true') ?: false
    def isReleaseTaskRequested = gradle.startParameter.taskNames.any {
        it.toLowerCase().contains('release')
    }
    if (buildAsApplication && !hasReleaseSigning && (isReleaseTaskRequested || requireReleaseSigning)) {
        def missingSigningMsg = "Release keystore credentials are missing (expected project/keystore.jks and KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
        if (requireReleaseSigning) {
            throw new GradleException("${missingSigningMsg} Failing build because CI_REQUIRE_RELEASE_SIGNING=true.")
        } else {
            logger.warn("WARNING: ${missingSigningMsg} Falling back to debug signing config for release APK.")
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile releaseKeystoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    aaptOptions {
        noCompress 'glsl', 'zip'
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.libsdl.app.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
}

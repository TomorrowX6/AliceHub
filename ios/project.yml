name: AliceHub
options:
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: '15.0'
settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '15.0'
targets:
  AliceHub:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../project/app/src/main/res/drawable-nodpi
        type: folder
        buildPhase: resources
      - path: ../project/app/src/main/res/raw/full_unlock_saves.zip
        buildPhase: resources
      - path: ../xsystem4/shaders
        type: folder
        buildPhase: resources
      - path: ../xsystem4/fonts
        type: folder
        buildPhase: resources
      - path: ../xsystem35/fonts/MTLc3m.ttf
        buildPhase: resources
      - path: ../xsystem35/fonts/mincho.ttf
        buildPhase: resources
      - path: ../xsystem35/soundfonts
        type: folder
        buildPhase: resources
      - path: build/system3
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.alicehub
        INFOPLIST_FILE: App/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: App/AliceHub-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/build/$(PLATFORM_NAME)/stage/include
          - $(SRCROOT)/build/$(PLATFORM_NAME)/stage/include/SDL2
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/build/$(PLATFORM_NAME)/stage/lib
        OTHER_LDFLAGS: $(inherited) -Wl,-force_load,$(SRCROOT)/build/$(PLATFORM_NAME)/stage/lib/libxsystem4_engine.a -Wl,-force_load,$(SRCROOT)/build/$(PLATFORM_NAME)/stage/lib/libxsystem35_engine.a -Wl,-force_load,$(SRCROOT)/build/$(PLATFORM_NAME)/stage/lib/libsystem3_engine.a -lSDL2_mixer -lSDL2 -lfreetype $(HVF_LDFLAGS) -lffi -lsndfile -lvorbisfile -lvorbisenc -lvorbis -logg -lturbojpeg -lwebp -lsharpyuv -lpng16 -ldeflate -larchive -llzma -lz -liconv -lc++ -framework UIKit -framework OpenGLES -framework QuartzCore -framework AVFoundation -framework AudioToolbox -framework CoreAudio -framework CoreMotion -framework CoreHaptics -framework GameController -framework Metal -framework CoreBluetooth -framework CoreGraphics -framework CoreVideo -framework CoreFoundation -framework Foundation
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        CURRENT_PROJECT_VERSION: '1'
        MARKETING_VERSION: '0.1.0'
    scheme: {}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AliceHub</title>
  <meta name="description" content="AliceSoft System 多平台原生启动器。" />
  <meta name="theme-color" content="#070709" />
  <link rel="icon" type="image/png" href="assets/alice-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="site.css?v=20261128g" />
</head>
<body>
  <!-- Full-Viewport Interactive Three.js 3D Curved Background Wall -->
  <canvas id="webgl-stage" class="webgl-stage" aria-hidden="true"></canvas>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Minimal Transparent Top Bar -->
  <header class="site-nav">
    <div class="nav-inner">
      <div class="brand">
        <img src="assets/alice-icon.png" alt="AliceHub" class="brand-icon" width="24" height="24" />
        <span>AliceHub</span>
      </div>

      <nav class="nav-right" aria-label="Utility">
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" class="lang-btn is-active" data-lang="zh">简</button>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="ja">日</button>
        </div>
        <a href="https://github.com/TomorrowX6/AliceHub" target="_blank" rel="noopener" class="nav-link">GitHub</a>
        <button type="button" class="nav-link nav-link-strong" data-open-dl data-i18n="nav.download">下载</button>
      </nav>
    </div>
  </header>

  <!-- Single-Screen Unobstructed 3D Gallery Stage -->
  <main class="stage">
    <div class="stage-scrim" aria-hidden="true"></div>

    <div class="stage-bottom">
      <div class="stage-row-top">
        <div class="stage-focus">
          <span class="focus-dot"></span>
          <span id="hud-title">兰斯 10 -决战-</span>
          <span class="focus-sep">/</span>
          <span id="hud-eng">xsystem4</span>
        </div>
      </div>

      <div class="stage-rule"></div>

      <div class="stage-row-main">
        <div class="poster-id">
          <button type="button" class="alice-emblem" id="alice-emblem" aria-label="AliceHub">
            <div class="alice-stage" id="alice-avatar-box">
              <img src="assets/alice-face-shell.png" alt="AliceHub" class="alice-shell" width="60" height="60" />
              <span class="alice-eye alice-eye-rose" id="alice-eye-m" aria-hidden="true"><span class="eye-glint"></span></span>
              <span class="alice-eye alice-eye-cyan" id="alice-eye-c" aria-hidden="true"><span class="eye-glint"></span></span>
            </div>
          </button>
          <div>
            <h1 class="poster-title">AliceHub</h1>
            <p class="poster-sub" data-i18n="hero.sub">AliceSoft System 多平台原生启动器</p>
          </div>
        </div>

        <div class="poster-actions">
          <a href="https://github.com/TomorrowX6/AliceHub" target="_blank" rel="noopener" class="poster-btn poster-gh">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.25.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.04 0 0 .97-.31 3.17 1.18a11.03 11.03 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.58.23 2.75.11 3.04.74.8 1.19 1.83 1.19 3.08 0 4.41-2.69 5.39-5.26 5.67.41.36.78 1.06.78 2.14 0 1.55-.01 2.8-.01 3.18 0 .31.21.68.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/></svg>
            <span>GitHub</span>
          </a>
          <button type="button" class="poster-btn poster-qq" data-open-qq>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v3h-1M14 20h7"/></svg>
            <span data-i18n="hero.qq">QQ 群</span>
          </button>
          <button type="button" class="poster-cta" data-open-dl>
            <span data-i18n="hero.cta">获取版本</span>
            <code id="hero-ver">f0810b6</code>
            <span aria-hidden="true">↗</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- QQ Group QR Code Modal -->
  <div class="dl-modal" id="qq-modal" role="dialog" aria-modal="true" aria-labelledby="qq-modal-title" hidden>
    <div class="dl-backdrop" data-close-qq></div>

    <div class="dl-dialog qq-dialog">
      <div class="dl-head">
        <div class="dl-head-left">
          <span id="qq-modal-title" data-i18n="dl.qq">QQ 交流群</span>
          <code>383917628</code>
        </div>
        <button type="button" class="dl-close" data-close-qq aria-label="Close">×</button>
      </div>

      <div class="qq-qr-frame">
        <img src="assets/qq-group-qr.webp" alt="AliceHub QQ Group 383917628 QR Code" width="260" height="320" />
      </div>

      <div class="qq-foot">
        <span data-i18n="qq.hint">手机 QQ 扫码加入交流群</span>
        <button type="button" class="qq-copy-btn" data-copy-qq data-qq="383917628" data-i18n="qq.copy">复制群号</button>
      </div>
    </div>
  </div>

  <!-- Minimal Swiss Hairline Release Modal -->
  <div class="dl-modal" id="dl-modal" role="dialog" aria-modal="true" aria-labelledby="dl-modal-title" hidden>
    <div class="dl-backdrop" data-close-dl></div>

    <div class="dl-dialog">
      <div class="dl-head">
        <div class="dl-head-left">
          <span id="dl-modal-title" data-i18n="dl.title">下载</span>
          <code id="dl-release-tag">f0810b6</code>
        </div>
        <button type="button" class="dl-close" data-close-dl aria-label="Close">×</button>
      </div>

      <div class="release-list">
        <a class="release-row" id="dl-card-android" href="https://github.com/TomorrowX6/AliceHub/releases/latest" target="_blank" rel="noopener">
          <span class="rr-name">Android</span>
          <span class="rr-meta" data-i18n="dl.android">Android 8.0+ · 直接安装</span>
          <span class="rr-size" id="dl-size-android">44.3 MiB</span>
          <span class="rr-ext">APK <em>↗</em></span>
        </a>

        <a class="release-row" id="dl-card-ios" href="https://github.com/TomorrowX6/AliceHub/releases/latest" target="_blank" rel="noopener">
          <span class="rr-name">iOS / iPadOS</span>
          <span class="rr-meta" data-i18n="dl.ios">iOS 15+ · 自签侧载</span>
          <span class="rr-size" id="dl-size-ios">48.6 MiB</span>
          <span class="rr-ext">IPA <em>↗</em></span>
        </a>

        <a class="release-row" id="dl-card-switch" href="https://github.com/TomorrowX6/AliceHub/releases/latest" target="_blank" rel="noopener">
          <span class="rr-name">Nintendo Switch</span>
          <span class="rr-meta" data-i18n="dl.switch">Homebrew · 解压至 /switch/</span>
          <span class="rr-size" id="dl-size-switch">85.9 MiB</span>
          <span class="rr-ext">ZIP <em>↗</em></span>
        </a>
      </div>
    </div>
  </div>

  <script type="module" src="site.js?v=20261128i"></script>
</body>
</html>

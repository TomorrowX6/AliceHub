name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ABI_NAMES: arm64-v8a
      ANDROID_API_LEVEL: 26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            SDK_NINJA=$(ls -d "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"/cmake/*/bin/ninja 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -n "$SDK_NINJA" ]; then
              echo "$(dirname "$SDK_NINJA")" >> "$GITHUB_PATH"
              export PATH="$(dirname "$SDK_NINJA"):$PATH"
            fi
          fi
          MISSING=""
          for cmd in ninja:ninja-build bison:bison flex:flex autoconf:autoconf automake:automake libtoolize:libtool pkg-config:pkg-config; do
            bin="${cmd%%:*}"
            pkg="${cmd##*:}"
            command -v "$bin" >/dev/null 2>&1 || MISSING="$MISSING $pkg"
          done
          if [ -n "$MISSING" ]; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            fi
            sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
            sudo apt-get update
            sudo apt-get install -y $MISSING
          fi

      - name: Build Native Libraries
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          sed -i 's/\r$//' ./build-shared-libs.sh ./collect-licenses.sh
          chmod +x ./build-shared-libs.sh ./collect-licenses.sh
          ./build-shared-libs.sh

      - name: Build Signed APK
        run: |
          cd project
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          if [ -n "${KEYSTORE_BASE64}" ] && [ -n "${KEYSTORE_PASSWORD}" ] && [ -n "${KEY_ALIAS}" ] && [ -n "${KEY_PASSWORD}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > keystore.jks
          else
            rm -f keystore.jks
            echo "::warning::Release signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) are missing; building with debug signing config unless CI_REQUIRE_RELEASE_SIGNING=true."
          fi
          SHORT_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ -n "${REF_NAME}" ]; then
            APP_VER="${REF_NAME}"
          elif [ -n "${REF_NAME}" ]; then
            APP_VER="${REF_NAME}-${SHORT_SHA}"
          else
            APP_VER="${SHORT_SHA}"
          fi
          ./gradlew assembleRelease \
            "-PAPP_VERSION_NAME=${APP_VER}" \
            "-PCI_REQUIRE_RELEASE_SIGNING=${CI_REQUIRE_RELEASE_SIGNING}"
          cp app/build/outputs/apk/release/app-release.apk ../re-xsystem4-arm64-v8a.apk
        env:
          REF_NAME: ${{ github.ref_name }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CI_REQUIRE_RELEASE_SIGNING: ${{ vars.CI_REQUIRE_RELEASE_SIGNING || 'false' }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: re-xsystem4-arm64-v8a
          path: re-xsystem4-arm64-v8a.apk
          if-no-files-found: error

  switch:
    name: Build Switch homebrew
    runs-on: ubuntu-latest
    container: devkitpro/devkita64
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build tools
        run: apt-get update && apt-get install -y --no-install-recommends bison flex gcc libc6-dev python3 zlib1g-dev libarchive-dev

      - name: Test Switch hub model
        run: python3 -m unittest discover -s xsystem4/test/native -p test_switch_hub.py

      - name: Build Switch NROs
        shell: bash
        run: |
          export PATH="$DEVKITPRO/portlibs/switch/bin:$DEVKITPRO/devkitA64/bin:$DEVKITPRO/tools/bin:$PATH"
          aarch64-none-elf-cmake -G Ninja -S cmake/switch -B build-switch -DCMAKE_BUILD_TYPE=Release
          CMAKE_BUILD_PARALLEL_LEVEL=2 cmake --build build-switch --parallel 2

      - name: Upload Switch NROs
        uses: actions/upload-artifact@v4
        with:
          name: AliceHub-switch
          path: build-switch/artifacts/*.nro
          if-no-files-found: error

  ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      IOS_BUILD_NUMBER: ${{ github.run_number }}
      IOS_MARKETING_VERSION: 0.1.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^26.0'

      - name: Install build tools
        run: brew install cmake ninja autoconf automake libtool bison flex pkgconf xcodegen

      - name: Identify native toolchain
        id: toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          ID=$({ xcodebuild -version; brew list --versions cmake ninja autoconf automake libtool bison flex pkgconf; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Cache native libraries and downloads
        uses: actions/cache@v4
        with:
          path: |
            ios/build/iphoneos/stage
            ios/build/iphoneos/*-prefix/src/*.tar.*
          key: ios-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('ios/CMakeLists.txt', 'ios/*.sh', 'ios/*.cmake', 'ios/EnginePlatform.*', 'cmake/**', 'xsystem4/**') }}

      - name: Build unsigned IPA
        run: |
          ios/build-app.sh ipa
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          cp ios/build/AliceHub.ipa "ios/build/AliceHub-${SHORT_SHA}-ios-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AliceHub-ios-unsigned
          path: ios/build/AliceHub-*-ios-unsigned.ipa
          if-no-files-found: error

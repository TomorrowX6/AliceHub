name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ABI_NAMES: arm64-v8a
      ANDROID_API_LEVEL: 26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            SDK_NINJA=$(ls -d "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"/cmake/*/bin/ninja 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -n "$SDK_NINJA" ]; then
              echo "$(dirname "$SDK_NINJA")" >> "$GITHUB_PATH"
              export PATH="$(dirname "$SDK_NINJA"):$PATH"
            fi
          fi
          MISSING=""
          for cmd in ninja:ninja-build bison:bison flex:flex autoconf:autoconf automake:automake libtoolize:libtool pkg-config:pkg-config; do
            bin="${cmd%%:*}"
            pkg="${cmd##*:}"
            command -v "$bin" >/dev/null 2>&1 || MISSING="$MISSING $pkg"
          done
          if [ -n "$MISSING" ]; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            fi
            sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
            sudo apt-get update
            sudo apt-get install -y $MISSING
          fi

      - name: Build Native Libraries
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          sed -i 's/\r$//' ./build-shared-libs.sh ./collect-licenses.sh
          chmod +x ./build-shared-libs.sh ./collect-licenses.sh
          ./build-shared-libs.sh

      - name: Build Signed APK
        run: |
          set -euo pipefail
          cd project
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Release signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) are required in CI; debug signing fallback is forbidden."
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | tr -d '\r\n' | base64 -d > keystore.jks
          chmod 600 keystore.jks
          if [ ! -s keystore.jks ]; then
            rm -f keystore.jks
            echo "::error::Decoded project/keystore.jks is empty."
            exit 1
          fi
          SHORT_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ -n "${REF_NAME:-}" ]; then
            APP_VER="${REF_NAME}"
          elif [ -n "${REF_NAME:-}" ]; then
            APP_VER="${REF_NAME}-${SHORT_SHA}"
          else
            APP_VER="${SHORT_SHA}"
          fi
          ./gradlew assembleRelease \
            "-PAPP_VERSION_NAME=${APP_VER}" \
            "-PCI_REQUIRE_RELEASE_SIGNING=true"
          cp app/build/outputs/apk/release/app-release.apk ../AliceHub-arm64-v8a.apk
        env:
          REF_NAME: ${{ github.ref_name }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CI_REQUIRE_RELEASE_SIGNING: 'true'

      - name: Verify APK Signature
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(ls -1 "${SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "${APKSIGNER}" ] || [ ! -x "${APKSIGNER}" ]; then
            echo "::error::apksigner not found under ${SDK_ROOT}/build-tools"
            exit 1
          fi

          "${APKSIGNER}" verify AliceHub-arm64-v8a.apk
          # Pass --min-sdk-version 23 (< 24) so apksigner verifies V1 (JAR) in addition to V2 and V3
          # even though the APK manifest minSdkVersion is 26.
          VERIFY_OUT=$("${APKSIGNER}" verify --verbose --print-certs --min-sdk-version 23 AliceHub-arm64-v8a.apk)
          echo "${VERIFY_OUT}"

          for expected_line in \
            "Verified using v1 scheme (JAR signing): true" \
            "Verified using v2 scheme (APK Signature Scheme v2): true" \
            "Verified using v3 scheme (APK Signature Scheme v3): true" \
            "Number of signers: 1"; do
            if ! printf '%s\n' "${VERIFY_OUT}" | grep -Fq "${expected_line}"; then
              echo "::error::APK signature check failed: missing '${expected_line}'"
              exit 1
            fi
          done

          APK_SHA256=$(printf '%s\n' "${VERIFY_OUT}" \
            | awk '/^(Signer #1|V[0-9.]+ Signer:)[[:space:]]+certificate SHA-256 digest:[[:space:]]*/ && !found { sub(/^.*certificate SHA-256 digest:[[:space:]]*/, ""); gsub(/[[:space:]]/, ""); print tolower($0); found=1 }')
          KEYTOOL_OUT=$(LC_ALL=C keytool -list -v -keystore project/keystore.jks -alias "${KEY_ALIAS}" -storepass:env KEYSTORE_PASSWORD)
          EXPECTED_SHA256=$(printf '%s\n' "${KEYTOOL_OUT}" \
            | awk '{ line = tolower($0) } line ~ /^[[:space:]]*sha-?256:[[:space:]]*/ && !found { sub(/^[[:space:]]*sha-?256:[[:space:]]*/, "", line); gsub(/[:[:space:]]/, "", line); print line; found=1 }')

          if [ -z "${APK_SHA256}" ] || [ -z "${EXPECTED_SHA256}" ]; then
            echo "::error::Failed to extract certificate SHA-256 (apk='${APK_SHA256}', expected='${EXPECTED_SHA256}')"
            exit 1
          fi
          if [ "${APK_SHA256}" != "${EXPECTED_SHA256}" ]; then
            echo "::error::APK signer SHA-256 (${APK_SHA256}) does not match release keystore (${EXPECTED_SHA256})"
            exit 1
          fi
          echo "Verified V1 + V2 + V3 APK signature matches release keystore (SHA-256: ${APK_SHA256})"
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Clean Up Keystore
        if: always()
        run: rm -f project/keystore.jks

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AliceHub-arm64-v8a
          path: AliceHub-arm64-v8a.apk
          if-no-files-found: error

  switch:
    name: Build Switch homebrew
    runs-on: ubuntu-latest
    container: devkitpro/devkita64
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build tools
        run: apt-get update && apt-get install -y --no-install-recommends bison flex gcc libc6-dev python3 python3-pil zlib1g-dev libarchive-dev pkg-config libpng-dev libjpeg-dev

      - name: Test Switch hub model
        run: python3 -m unittest discover -s xsystem4/test/native -p test_switch_hub.py

      - name: Build Switch NROs
        shell: bash
        run: |
          export PATH="$DEVKITPRO/portlibs/switch/bin:$DEVKITPRO/devkitA64/bin:$DEVKITPRO/tools/bin:$PATH"
          aarch64-none-elf-cmake -G Ninja -S cmake/switch -B build-switch -DCMAKE_BUILD_TYPE=Release
          CMAKE_BUILD_PARALLEL_LEVEL=2 cmake --build build-switch --parallel 2

      - name: Upload Switch NROs
        uses: actions/upload-artifact@v4
        with:
          name: AliceHub-switch
          path: build-switch/artifacts/*.nro
          if-no-files-found: error

  ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      IOS_BUILD_NUMBER: ${{ github.run_number }}
      IOS_MARKETING_VERSION: 0.1.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^26.0'

      - name: Install build tools
        run: brew install cmake ninja autoconf automake libtool bison flex pkgconf xcodegen

      - name: Identify native toolchain
        id: toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          ID=$({ xcodebuild -version; brew list --versions cmake ninja autoconf automake libtool bison flex pkgconf; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Cache native libraries and downloads
        uses: actions/cache@v4
        with:
          path: |
            ios/build/iphoneos/stage
            ios/build/iphoneos/*-prefix/src/*.tar.*
          key: ios-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('ios/CMakeLists.txt', 'ios/*.sh', 'ios/*.cmake', 'ios/EnginePlatform.*', 'cmake/**', 'xsystem4/**') }}

      - name: Build unsigned IPA
        run: |
          ios/build-app.sh ipa
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          cp ios/build/AliceHub.ipa "ios/build/AliceHub-${SHORT_SHA}-ios-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AliceHub-ios-unsigned
          path: ios/build/AliceHub-*-ios-unsigned.ipa
          if-no-files-found: error
